apiVersion: v2 
name: observability
description: GitOps-managed observability stack (Prometheus, Grafana, Loki, Tempo, Alloy)
type: application 
version: 0.1.0
dependencies:
  - name: prometheus
    version: "29.47.2"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
  - name: grafana
    version: "14.4.2"
    repository: https://grafana-community.github.io/helm-charts
    condition: grafana.enabled