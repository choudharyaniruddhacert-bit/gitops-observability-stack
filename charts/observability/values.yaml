prometheus:
  enabled: true
  server:
    replicaCount: 2
    statefulSet:
      enabled: true
    retention: 15d
    persistentVolume:
      enabled: true
      size: 50Gi
    extraFlags:
      - web.enable-lifecycle
      - web.enable-remote-write-receiver
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 4Gi
  alertmanager:
    enabled: true
    replicaCount: 3
    persistence:
      enabled: true
      size: 2Gi
  kube-state-metrics:
    enabled: true
  prometheus-node-exporter:
    enabled: true
  prometheus-pushgateway:
    enabled: false

grafana:
  enabled: true
  replicas: 1
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    size: 10Gi
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://observability-prometheus-server
          isDefault: true
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://observability-loki:3100
          jsonData:                                   # P4: log → trace link
            derivedFields:
              - name: TraceID
                matcherType: regex
                matcherRegex: 'trace_id=(\w+)'
                url: '$${__value.raw}'
                datasourceUid: tempo
                urlDisplayLabel: View trace
        - name: Tempo                                 # P4: new data source
          uid: tempo
          type: tempo
          access: proxy
          url: http://observability-tempo:3200
          jsonData:
            tracesToLogsV2:                           # P4: trace → log link
              datasourceUid: loki
              spanStartTimeShift: "-5m"
              spanEndTimeShift: "5m"
              customQuery: true
              query: '{namespace="demo"} |= "$${__trace.traceId}"'
            nodeGraph:
              enabled: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true

seaweedfs:
  enabled: true
  fullnameOverride: seaweedfs
  master:
    enabled: false
    volumeSizeLimitMB: 1000
  volume:
    enabled: false
  filer:
    enabled: false
  allInOne:
    enabled: true
    data:
      type: persistentVolumeClaim
      size: 50Gi
    s3:
      enabled: true
      enableAuth: true
      existingConfigSecret: seaweedfs-s3
      createBuckets:
        - name: loki-chunks
        - name: loki-ruler
        - name: tempo-traces

loki:
  enabled: true
  deploymentMode: Monolithic
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    storage:
      type: s3
      bucketNames:
        chunks: loki-chunks
        ruler: loki-ruler
      s3:
        endpoint: seaweedfs-all-in-one.observability.svc:8333
        region: us-east-1
        accessKeyId: ${AWS_ACCESS_KEY_ID}
        secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
        s3ForcePathStyle: true
        insecure: true
  singleBinary:
    replicas: 1
    extraEnvFrom:
      - secretRef:
          name: seaweedfs-s3
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 2Gi
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  gateway:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false

tempo:                                                # P4: new block
  enabled: true
  tempo:
    retention: 168h
    extraArgs:
      config.expand-env: true
    extraEnvFrom:
      - secretRef:
          name: seaweedfs-s3
    storage:
      trace:
        backend: s3
        s3:
          bucket: tempo-traces
          endpoint: seaweedfs-all-in-one.observability.svc:8333
          access_key: ${AWS_ACCESS_KEY_ID}
          secret_key: ${AWS_SECRET_ACCESS_KEY}
          insecure: true
          forcepathstyle: true
        wal:
          path: /var/tempo/wal
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 2Gi
  persistence:
    enabled: true
    size: 10Gi

alloy:
  enabled: true
  controller:
    type: deployment
    replicas: 1
  alloy:
    configMap:
      create: false
      name: alloy-config
      key: config.alloy
    extraPorts:                                       # P4: OTLP receiver ports
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP