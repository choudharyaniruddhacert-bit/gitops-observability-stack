# ---------- App code (your OTel-lab services) ----------
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-code
  namespace: demo
data:
  order.py: |
    import logging, os, random
    import requests
    from flask import Flask

    app = Flask(__name__)
    log = logging.getLogger("order")
    PAYMENT_URL = os.getenv("PAYMENT_URL", "http://payment:8080/pay")

    @app.route("/order")
    def order():
        order_id = random.randint(1000, 9999)
        log.info("order received order_id=%s", order_id)
        r = requests.get(PAYMENT_URL, timeout=3)
        log.info("payment result status=%s order_id=%s", r.status_code, order_id)
        return {"order_id": order_id, "payment": r.status_code}, r.status_code

    @app.route("/healthz")
    def healthz():
        return "ok"

    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=8080)

  payment.py: |
    import logging, random, time
    from flask import Flask

    app = Flask(__name__)
    log = logging.getLogger("payment")

    @app.route("/pay")
    def pay():
        time.sleep(random.uniform(0.05, 0.5))
        if random.random() < 0.2:
            log.error("payment failed: card declined")
            return {"status": "failed"}, 500
        log.info("payment approved")
        return {"status": "ok"}, 200

    @app.route("/healthz")
    def healthz():
        return "ok"

    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=8080)
---
# ---------- order ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order
    spec:
      containers:
        - name: order
          image: python:3.12-slim
          command: ["sh", "-c"]
          args:
            - pip install -q flask requests opentelemetry-distro opentelemetry-exporter-otlp &&
              opentelemetry-bootstrap -a install &&
              opentelemetry-instrument python /app/order.py
          env:
            - name: OTEL_SERVICE_NAME
              value: order
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://observability-alloy.observability.svc:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
              value: "true"
            - name: OTEL_PYTHON_LOG_CORRELATION
              value: "true"
            - name: OTEL_PYTHON_LOG_LEVEL
              value: info
            - name: PAYMENT_URL
              value: http://payment:8080/pay
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: code
              mountPath: /app
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: code
          configMap:
            name: demo-code
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: demo
spec:
  selector:
    app.kubernetes.io/name: order
  ports:
    - port: 8080
      targetPort: 8080
---
