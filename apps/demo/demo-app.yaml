# ---------- traffic generator: calls /order every 2s ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
    spec:
      containers:
        - name: loadgen
          image: curlimages/curl:8.11.1
          command: ["sh", "-c"]
          args:
            - while true; do curl -s -o /dev/null -w "%{http_code}\n" http://order:8080/order; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi