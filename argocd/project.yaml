apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata: 
  name: observability
  namespace: argocd
spec:
  description: GitOps-managed observability stack
  sourceRepos: 
    - https://github.com/choudharyaniruddhacert-bit/gitops-observability-stack.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: observability
    - server: https://kubernetes.default.svc
      namespace: demo
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: scheduling.k8s.io
      kind: PriorityClass
    - group:  apiextensions.k8s.io
      kind: CustomResourceDefinition
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"