prometheus:
  server:
    replicaCount: 1
    retention: 3d
    persistentVolume:
      size: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
  alertmanager:
    replicaCount: 1
    persistence:
      size: 1Gi

grafana:
  persistence:
    size: 2Gi

seaweedfs:
  master:
    volumeSizeLimitMB: 100
  allInOne:
    data:
      size: 5Gi

loki:
  singleBinary:
    persistence:
      size: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

tempo:
  tempo:
    retention: 24h
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  persistence:
    size: 2Gi