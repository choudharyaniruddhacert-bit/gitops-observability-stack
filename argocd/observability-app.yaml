apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace:  argocd
spec:
  project: observability
  source:
    repoURL: https://github.com/choudharyaniruddhacert-bit/gitops-observability-stack.git
    targetRevision: main
    path: charts/observability
    helm:
      releaseName: observability
      valueFiles:
        - values.yaml
        - ../../argocd/values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true